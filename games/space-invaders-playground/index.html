<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Space Invaders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <header>
        <a href="../../" class="header-btn home-link" title="Playground">&#8592; Playground</a>
        <h1 id="header-title">Space Invaders</h1>
        <div class="header-right">
            <button class="header-btn" id="btn-reset" title="Restart">&#8634;</button>
            <div class="lang-pill" id="lang-pill"><button class="lang-opt active" data-lang="en">EN</button><button class="lang-opt" data-lang="cz">CZ</button></div>
            <button class="theme-toggle" id="theme-toggle" title="Toggle theme"><span class="toggle-knob"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"></path></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg></span></button>
        </div>
    </header>
    <div class="app-stage"><iframe id="app-frame" class="app-frame" title="Space Invaders" loading="eager"></iframe></div>
    <script>
        window.GAME_INFO = { title: { en: 'Space Invaders', cz: 'Space Invaders' }, path: '../space-invaders/index.html', requiresLicense: true };
        window.GAME_LICENSE_TITLE = 'Space Invaders';
        window.GAME_LICENSE_HOME_PATH = '../../buy-ticket/';
        window.GAME_LICENSE_BUY_PATH = '../../buy-ticket/';
        window.GAME_PREVIEW_PATH = '../../preview/space-invaders/';
        window.GAME_HOME_PATH = '../../';
        window.GAME_GATE_CONTAINER_SELECTOR = '.app-stage';
        window.PLAYGROUND_MENU_ROOT = '../../';
        window.PLAYGROUND_HELP = { title: 'Space Invaders help', subtitle: 'Defend the line and clear every wave.', sections: [ { heading: 'Goal', text: 'Survive three waves, protect your remaining lives, and clear the fleet before it reaches the ground.' }, { heading: 'Controls', items: ['Arrow Left / Right or A / D to move.', 'Space to fire.', 'Use restart in the header to relaunch instantly.'] }, { heading: 'Difficulty', text: 'Enemy fire and fleet pace scale up every wave.' } ] };
    </script>
    <script src="../../playground-config.js"></script>
    <script src="../../shared/account.js"></script>
    <script src="../../shared/menu.js"></script>
    <script src="../playground-shell.js"></script>
    <script src="../license-gate.js"></script>
</body>
</html>
