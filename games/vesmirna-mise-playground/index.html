<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Mission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../playground-shell.css">
    <link rel="stylesheet" href="../../shared/help.css">
</head>
<body>
    <header>
        <a href="../../" class="header-btn home-link" title="Playground">&#8592; Playground</a>
        <h1 id="header-title">Space Mission</h1>
        <div class="header-right">
            <button class="header-btn" id="btn-reset" title="Restart">&#8634;</button>
            <div class="lang-pill" id="lang-pill"><button class="lang-opt active" data-lang="en">EN</button><button class="lang-opt" data-lang="cz">CZ</button></div>
            <button class="theme-toggle" id="theme-toggle" title="Toggle theme"><span class="toggle-knob"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"></path></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg></span></button>
        </div>
    </header>
    <div class="app-stage"><iframe id="app-frame" class="app-frame" title="Space Mission" loading="eager"></iframe></div>
    <script>
        window.GAME_INFO = { title: { en: 'Space Mission', cz: 'Vesmírná mise' }, path: '../vesmirna-mise/index.html' };
        window.GAME_HOME_PATH = '../../';
        window.PLAYGROUND_HELP = {
            title: { en: 'Space Mission', cz: 'Vesmírná mise' },
            subtitle: { en: 'Steer, pace the mission, and time the shield.', cz: 'Řiďte, hlídejte tempo a načasujte štít.' },
            sections: [
                { heading: { en: 'Goal', cz: 'Cíl' }, text: { en: 'Stay alive long enough to survive the mission window while obstacles and solar pressure ramp up.', cz: 'Vydržte celé okno mise, zatímco přibývají překážky a sluneční tlak.' } },
                { heading: { en: 'Controls', cz: 'Ovládání' }, items: [
                    { en: 'Arrow Left / Right to steer.', cz: 'Šipky vlevo / vpravo pro řízení.' },
                    { en: 'Arrow Up / Down to control velocity.', cz: 'Šipky nahoru / dolů pro rychlost.' },
                    { en: 'Left Ctrl activates the shield once it is available.', cz: 'Levý Ctrl aktivuje štít, jakmile je dostupný.' }
                ] },
                { heading: { en: 'Difficulty', cz: 'Obtížnost' }, text: { en: 'Higher modes trigger denser obstacles and earlier solar pressure.', cz: 'Vyšší obtížnost přináší hustší překážky a dřívější sluneční tlak.' } }
            ]
        };
    </script>
    <script src="../playground-shell.js"></script>
    <script src="../../shared/help.js"></script>
</body>
</html>
