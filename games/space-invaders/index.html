<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game" class="game-shell">
        <section class="hud-row">
            <article class="hud-card">
                <span>Goal</span>
                <strong>Clear three waves</strong>
            </article>
            <article class="hud-card">
                <span>Controls</span>
                <strong>Left / Right / Space</strong>
            </article>
            <article class="hud-card">
                <span>Status</span>
                <strong id="status-text">Defend the line</strong>
            </article>
        </section>

        <div class="canvas-shell">
            <canvas id="canvas" width="900" height="560"></canvas>
        </div>

        <section class="info-strip">
            <div><span class="label">Score</span><strong id="score-value">0</strong></div>
            <div><span class="label">Lives</span><strong id="lives-value">3</strong></div>
            <div><span class="label">Wave</span><strong id="wave-value">1 / 3</strong></div>
        </section>

        <p id="instructions">Move with the arrow keys or A / D. Press Space to fire. Enemy shots get faster every wave.</p>
    </div>

    <div id="message-modal" class="message-modal" aria-hidden="true">
        <div class="message-modal-content">
            <button class="message-close" type="button" aria-label="Close">&times;</button>
            <p id="message-text"></p>
            <button id="message-ok" type="button">Play again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
