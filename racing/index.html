<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4a7a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Racing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="../shared/help.css">
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
        window.PLAYGROUND_HELP = {
            title: { en: 'Racing', cz: 'Závody' },
            subtitle: { en: 'Everything you need before the lights go out.', cz: 'Vše, co potřebujete, než zhasnou světla.' },
            sections: [
                { heading: { en: 'Goal', cz: 'Cíl' }, text: { en: 'Beat four AI rivals over 3, 5, or 8 laps. Your best lap and best race times are saved in this browser.', cz: 'Porazte čtyři soupeře na 3, 5 nebo 8 kol. Nejlepší kolo a nejlepší závod se ukládají v tomto prohlížeči.' } },
                { heading: { en: 'Keyboard', cz: 'Klávesnice' }, items: [
                    { en: '↑ / W accelerate, ↓ / S / Space brake and reverse.', cz: '↑ / W plyn, ↓ / S / Mezerník brzda a couvání.' },
                    { en: '← → / A D steer.', cz: '← → / A D řízení.' },
                    { en: 'C switches camera, P or Esc pauses.', cz: 'C přepíná kameru, P nebo Esc pozastaví hru.' }
                ] },
                { heading: { en: 'Touch', cz: 'Dotyk' }, items: [
                    { en: 'Drag the pad on the left to steer — further from the centre means a sharper turn.', cz: 'Táhněte ploškou vlevo – čím dál od středu, tím ostřejší zatáčka.' },
                    { en: 'Hold GAS or BRAKE on the right. You can slide your thumb between them.', cz: 'Vpravo držte PLYN nebo BRZDA. Palcem mezi nimi můžete přejíždět.' },
                    { en: 'Landscape orientation gives the best view.', cz: 'Nejlepší výhled je na šířku.' }
                ] },
                { heading: { en: 'Tips', cz: 'Tipy' }, items: [
                    { en: 'Lift off before the hairpin — hitting the wall costs a lot of speed.', cz: 'Před vracečkou uberte – náraz do zdi stojí hodně rychlosti.' },
                    { en: 'The restart button in the header returns to the race menu.', cz: 'Tlačítko restart v hlavičce vás vrátí do menu závodu.' }
                ] }
            ]
        };
    </script>
    <header>
        <a href="../" class="header-btn home-link" id="home-link" title="Playground">&#8592;<span class="home-label">&nbsp;Playground</span></a>
        <h1 id="header-title">Racing</h1>
        <div class="header-right">
            <button class="header-btn" id="btn-reset" title="Restart" aria-label="Restart">&#8634;</button>
            <div class="lang-pill" id="lang-pill">
                <button class="lang-opt active" data-lang="en">EN</button>
                <button class="lang-opt" data-lang="cz">CZ</button>
            </div>
            <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
                <span class="toggle-knob">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"></path></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
                </span>
            </button>
        </div>
    </header>

    <div id="game-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="data.js?v=2"></script>
    <script src="track.js?v=3"></script>
    <script src="car.js?v=2"></script>
    <script src="ai.js?v=2"></script>
    <script src="game.js?v=2"></script>
    <script src="../shared/help.js"></script>
</body>
</html>
