<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground</title>
    <meta name="description" content="Small web apps built with plain HTML and JavaScript.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/page.css">
    <style>
        .page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 0;
        }

        .hero h1 {
            margin: 10px 0 8px;
            font-size: clamp(32px, 6vw, 46px);
            line-height: 1.05;
            letter-spacing: -0.04em;
        }

        .hero p {
            max-width: 480px;
            margin: 0;
            font-size: 14px;
            color: var(--text-2);
        }

        .empty {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            align-self: flex-start;
            margin-top: 22px;
            padding: 8px 14px;
            border-radius: 8px;
            background: var(--sf);
            border: 1px dashed var(--bd2);
            font-size: 12px;
            color: var(--text-3);
        }

        .footer { margin-top: 0; }
    </style>
</head>
<body>
    <script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');</script>

    <div class="controls-pill">
        <div class="lang-pill" id="lang-pill">
            <button class="lang-opt active" data-lang="en">EN</button>
            <button class="lang-opt" data-lang="cz">CZ</button>
        </div>
        <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
            <span class="toggle-knob">
                <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"></path></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
            </span>
        </button>
    </div>

    <main class="page">
        <section class="hero">
            <span class="eyebrow">Playground</span>
            <h1 data-en="Small things for the web." data-cz="Malé věci pro web.">Small things for the web.</h1>
            <p data-en="A home for small web apps written in plain HTML and JavaScript. Nothing to install, no sign-up." data-cz="Domov pro malé webové aplikace v čistém HTML a JavaScriptu. Nic se neinstaluje, žádná registrace.">A home for small web apps written in plain HTML and JavaScript. Nothing to install, no sign-up.</p>
            <span class="empty" data-en="Nothing here yet — new projects are on the way." data-cz="Zatím tu nic není – nové projekty jsou na cestě.">Nothing here yet — new projects are on the way.</span>
        </section>

        <footer class="footer">
            <span>Author: Viktor Brunclík</span>
            <nav>
                <a href="privacy-policy/">Privacy Policy</a>
                <a href="LICENSE">MIT License</a>
            </nav>
        </footer>
    </main>

    <script src="shared/page.js"></script>
</body>
</html>
